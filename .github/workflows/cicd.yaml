name: cicd

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SKAFFOLD_DEFAULT_REPO: ghcr.io/con2
    steps:
      - uses: actions/checkout@v7
      - id: cache-bin
        uses: actions/cache@v6
        with:
          path: bin
          key: ${{ runner.os }}-bin-skaffold-helm-1
      - if: steps.cache-bin.outputs.cache-hit != 'true'
        run: |
          mkdir bin
          curl -Lo bin/skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
          curl -Lo bin/kubectl https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl
          curl -fsSL https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz | tar xz -C bin --strip-components=1 linux-amd64/helm
          chmod +x bin/skaffold bin/kubectl bin/helm
      - run: echo "$PWD/bin" >> $GITHUB_PATH
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: build
        run: |
          skaffold build --file-output build.json
          echo "build_json=$(base64 -w 0 < build.json)" >> "$GITHUB_OUTPUT"
    outputs:
      build_json: ${{ steps.build.outputs.build_json }}

  deploy:
    runs-on: qb-arc-runners
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v7
      - id: cache-bin
        uses: actions/cache@v6
        with:
          path: bin
          key: ${{ runner.os }}-bin-skaffold-helm-1
      - if: steps.cache-bin.outputs.cache-hit != 'true'
        run: |
          mkdir bin
          curl -Lo bin/skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
          curl -Lo bin/kubectl https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl
          curl -fsSL https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz | tar xz -C bin --strip-components=1 linux-amd64/helm
          chmod +x bin/skaffold bin/kubectl bin/helm
      - run: echo "$PWD/bin" >> $GITHUB_PATH
      - run: |
          base64 -d <<< "${{ needs.build.outputs.build_json }}" > build.json
          skaffold deploy -a build.json
