apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: infokala

build:
  local:
    useBuildkit: true
  artifacts:
    - image: infokala
      context: .

deploy:
  statusCheckDeadlineSeconds: 300
  helm:
    releases:
      - name: infokala
        chartPath: kubernetes/chart
        namespace: infokala
        valuesFiles:
          - kubernetes/chart/values-production.yaml
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_infokala}}"
          image.tag: "{{.IMAGE_TAG_infokala}}"
        wait: true

profiles:
  - name: staging
    # Reserved for future use -- not wired into any CI job yet. See kubernetes/chart/values-staging.yaml.
    deploy:
      helm:
        releases:
          - name: infokala
            chartPath: kubernetes/chart
            namespace: infokala-staging
            valuesFiles:
              - kubernetes/chart/values-staging.yaml
            setValueTemplates:
              image.repository: "{{.IMAGE_REPO_infokala}}"
              image.tag: "{{.IMAGE_TAG_infokala}}"
            wait: true
